name: MusicPlayer
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  MusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: .
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.musicplayer
        DEVELOPMENT_TEAM: ""
    capabilities:
      backgroundModes:
        enabled: true
        options:
          audio: true
          externalAccessory: true
      carPlay:
        enabled: true
    info:
      path: Info.plist

  MusicPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MusicPlayerTests
    dependencies:
      - target: MusicPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.musicplayer.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MusicPlayer.app/MusicPlayer"

  MusicPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MusicPlayerUITests
    dependencies:
      - target: MusicPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.musicplayer.uitests
        TEST_TARGET_NAME: MusicPlayer

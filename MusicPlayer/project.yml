name: MusicPlayer
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  MusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: .
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.musicplayer
        DEVELOPMENT_TEAM: ""
    capabilities:
      backgroundModes:
        enabled: true
        options:
          audio: true
          externalAccessory: true
      carPlay:
        enabled: true
    info:
      path: Info.plist
